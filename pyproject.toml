[project]
name = "sephora-test"
version = "0.1.0"
description = "This is the package created for the test sent by Sephora."
readme = "README.md"
authors = [
    { name = "Mounsef27", email = "monsaf.debbache@g.enp.edu.dz" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "tqdm>=4.70.0",
]

[project.scripts]
sephora-test = "sephora_test:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
preview = true
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
extend-ignore = [
    "D105",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "nltk>=3.10.3",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
]
