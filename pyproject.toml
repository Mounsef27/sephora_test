[project]
name = "sephora-test"
version = "0.1.0"
description = "This is the package created for the test sent by Sephora."
readme = "README.md"
authors = [
    { name = "Mounsef27", email = "monsaf.debbache@g.enp.edu.dz" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sephora-test = "sephora_test:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
preview = true  # required to enable DOC rules

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
extend-ignore = [
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # don't require docstrings in tests

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]
